# Config for the bundled demo backend (demo_target/server.py).
# Shows every knob; your real backend's config will set the same keys.

target:
  scheme: http
  host: demo-target        # docker-compose service name; use localhost when running locally
  port: 8080               # <-- the port parameter
  base_path: ""            # <-- the base-path parameter, e.g. /api/v1
  verify_tls: false
  timeout_s: 10

# JWKS endpoint enables the RS256->HS256 confusion test (C2)
jwks_url: "http://demo-target:8080/jwks.json"
jwt_iss: "https://auth.example"
jwt_aud: "api"

# Seed accounts the backend already has
users:
  user:  { username: alice, password: alice-pw, id: 1, email: alice@x.com }
  user2: { username: bob,   password: bob-pw,   id: 2, email: bob@x.com }
  admin: { username: admin, password: admin-pw, id: 3, email: admin@x.com }

# What the backend has. Checks for a feature that isn't listed are SKIPPED.
#   mfa  = the seed accounts have a second factor
#   csrf = auth rides on a cookie (the demo models CSRF although it uses bearer tokens)
features: [oauth, media_upload, mfa, csrf]

# An object owned by `owner` that `users.user` must NOT be able to read (BOLA),
# and a media file that legitimately exists (control for the traversal check).
bola_object: { kind: video, id: 102, owner: user2 }
media_sample: intro.mp4

# Test-profile hooks (a real backend exposes these only in a test build)
hooks:
  reset: "POST /test/reset"                     # clean state before each attack
  user_admin: "POST /test/users/{username}"     # set/read a user (AZ5, AZ6)
  other_aud_token: "GET /test/token?aud={aud}&username={username}&ttl={ttl}"  # SES7, C5
  db_probe: "GET /test/injected?marker={marker}"                    # MED3
  reset_introspect: true                        # reset endpoint echoes the link

suites: [access_control, media_injection]
fail_on_leak: true
