# Config to point appsec-sentinel at the running videosanity container.
#
#   image:     videosanity-videosanity-app:latest
#   container: videosanity-videosanity-app-1   (compose project "videosanity")
#   port:      8080
#
# ─────────────────────────────────────────────────────────────────────────────
#  READ THIS FIRST — the values marked  # TODO(verify)  are GUESSES.
#  Until they match videosanity's real routes / field names / token path / test
#  accounts, most checks will report INCONCLUSIVE ("control failed …") — the
#  harness no longer counts a 404 or a failed login as "attack blocked", so a
#  wrong config can't produce a false PASS, but it can't prove anything either.
#  Work through the TODOs, then run:
#      python scripts/preflight.py --config config/target.videosanity.yaml
#  Each INCONCLUSIVE line names the key that needs fixing.
# ─────────────────────────────────────────────────────────────────────────────

target:
  scheme: http                       # videosanity serves plain HTTP on 8080? else https
  host: videosanity-videosanity-app-1  # container name; resolves on the shared docker net
  port: 8080
  base_path: ""                      # TODO(verify): e.g. "/api" or "/api/v1" if routes are prefixed
  verify_tls: false
  timeout_s: 10

# ── Web front end ── TODO(verify) ───────────────────────────────────────────
# Set the port videosanity's web UI listens on to enable the front-end checks
# (FE1–FE5). Leave it out if the API serves the UI itself or there is none.
# frontend:
#   host: videosanity-videosanity-web-1   # TODO(verify)
#   port: 3000                            # TODO(verify)
#   api_path: /api                        # TODO(verify): if the web server proxies the API

# ── Route map — TODO(verify) EVERY LINE against videosanity's real API ──────
# Format: "METHOD /path/with/{params}" (or an absolute URL for a route served by
# another internal service/port). Delete a line to fall back to the default in
# sentinel/config.py (also a guess). `resource` matters most: "the user reads
# their own resource" is the control nearly every check runs first.
endpoints:
  login:           "POST /auth/login"            # TODO(verify)
  logout:          "POST /auth/logout"           # TODO(verify)
  refresh:         "POST /auth/refresh"          # TODO(verify)
  register:        "POST /auth/register"         # TODO(verify)
  admin_users:     "GET /admin/users"            # TODO(verify)
  admin_delete:    "DELETE /admin/users/{target}"# TODO(verify)
  resource:        "GET /resources/{owner_id}"   # TODO(verify)
  object:          "GET /{kind}s/{id}"           # TODO(verify)
  change_password: "POST /account/password"      # TODO(verify)
  sensitive:       "POST /account/payout"        # TODO(verify) — a step-up-guarded action
  change_email:    "POST /account/email"         # TODO(verify)
  media:           "GET /media/{path}"           # TODO(verify)
  upload:          "POST /upload"                # TODO(verify) — likely for a video app
  reset_request:   "POST /auth/reset/request"    # TODO(verify)
  reset_confirm:   "POST /auth/reset/confirm"    # TODO(verify)
  oauth_authorize: "GET /oauth/authorize"        # TODO(verify) — only if videosanity does OAuth
  oauth_token:     "POST /oauth/token"           # TODO(verify)
  buggy:           "GET /health"                 # TODO(verify): any endpoint that echoes/parses input

# ── Request field names videosanity expects ── TODO(verify) ─────────────────
fields:
  username: username        # TODO(verify): maybe "email" or "user"
  password: password        # TODO(verify)
  otp: otp                  # TODO(verify): remove if no 2FA
  email: email              # TODO(verify)
  token: token              # TODO(verify)
  new_password: newPassword # TODO(verify)
  old_password: old         # TODO(verify): current-password field on change-password
  upload_file: file         # TODO(verify): multipart field name for uploads
  fetch_url: fetchUrl       # TODO(verify): "import from URL" field, if videosanity has one

# ── Headers videosanity uses to signal things ── TODO(verify) ───────────────
# (these used to be "# ADAPT" code edits in http_target.py; they are config now)
signals:
  client_ip_header: "X-Forwarded-For"            # TODO(verify): header the proxy uses for the client IP
  csrf_header: "X-CSRF-Token: test-csrf-token"   # TODO(verify)
  step_up_header: "X-Step-Up: reauthed"          # TODO(verify): proof of a fresh re-auth
  email_verified_header: "X-Email-Verified: true"  # TODO(verify)

# ── How the access token comes back and how to send it ── TODO(verify) ──────
token_json_path: "access_token"    # TODO(verify): dot-path into the login JSON, e.g. "data.accessToken"
refresh_json_path: "refresh_token" # TODO(verify)
auth_header: "Authorization: Bearer {token}"  # TODO(verify): videosanity may use a session cookie instead
session_cookie: sid                # TODO(verify): name of the session cookie, if any
throttle_statuses: [429]           # TODO(verify): add 423 if lockouts answer "423 Locked"

# ── Real test accounts that EXIST in the videosanity test instance ──────────
# TODO(verify): these MUST be real or every authenticated test silently "passes".
# Use throwaway accounts on a disposable instance — the suite mutates them
# (changes passwords, email, etc.).
users:
  user:  { username: alice, password: alice-pw, id: 1, email: alice@example.test }  # TODO(verify)
  user2: { username: bob,   password: bob-pw,   id: 2, email: bob@example.test }    # TODO(verify)
  admin: { username: admin, password: admin-pw, id: 3, email: admin@example.test }  # TODO(verify)

# A video that belongs to user2 and that user must NOT be able to read (BOLA),
# and a media path that really exists (control for the path-traversal check).
bola_object: { kind: video, id: 102, owner: user2 }   # TODO(verify): a real id owned by user2
media_sample: intro.mp4                               # TODO(verify): a real media path, or null

# JWT iss/aud so forged-token tests fail on the alg, not on an iss/aud mismatch.
jwt_iss: "https://auth.example"    # TODO(verify)
jwt_aud: "api"                     # TODO(verify)
# jwks_url: "http://videosanity-videosanity-app-1:8080/.well-known/jwks.json"  # uncomment if present

# ── Which optional features videosanity actually has ────────────────────────
# Checks for a feature NOT listed here are SKIPPED (honest) rather than faked.
#   media_upload  uploads exist (near-certain for a video app)
#   oauth         OAuth2/PKCE endpoints exist
#   mfa           the test accounts have a second factor
#   csrf          auth rides on a cookie (not a bearer header)
features: [media_upload]           # TODO(verify): add oauth / mfa / csrf if they apply

# ── Gray-box test hooks — leave null for a true black-box run ────────────────
# videosanity would have to expose these in a TEST build. Null => the dependent
# ~8 checks report SKIPPED (honest), not a fake pass.
hooks:
  reset: null             # recommended: without it, lockouts from one check can leave a later
                          # one INCONCLUSIVE, and campaign passes after the first prove little
  user_admin: null
  other_aud_token: null
  db_probe: null
  reset_introspect: false

suites: [access_control, media_injection]   # `--suite all` adds oct2026, nov2026, automation, resilience, surface
fail_on_leak: true
fail_on_inconclusive: true
