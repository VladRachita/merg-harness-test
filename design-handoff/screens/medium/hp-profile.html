<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Icon grid · Medium</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>


<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #F7F5FB; color: #1D1B22; font-family: Roboto, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <div style="flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column">

    <div style="height: 56px; padding: 0 6px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0">
      <button type="button" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 22px; padding: 0">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 18l-6-6 6-6"></path></svg>
      </button>
      <button type="button" aria-label="Settings" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: 22px; padding: 0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; padding: 4px 16px 0; flex-shrink: 0">
      <div style="position: relative; width: 96px; height: 96px">
        <div style="width: 96px; height: 96px; box-sizing: border-box; border-radius: 50%; border: 2.5px solid #7155E0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 500; letter-spacing: 0.5px">MH</div>
        <button type="button" aria-label="Edit photo" style="position: absolute; right: -2px; bottom: 2px; width: 30px; height: 30px; box-sizing: border-box; border-radius: 50%; border: 2px solid #F7F5FB; background: #7155E0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path><path d="M13.5 6.5l4 4"></path></svg>
        </button>
      </div>
      <div style="margin-top: 14px; display: flex; align-items: center; gap: 6px">
        <span style="font-size: 22px; font-weight: 400">Maestro Host</span>
        <svg width="20" height="20" viewBox="0 0 24 24" role="img" aria-label="Verified"><circle cx="12" cy="12" r="10" fill="#2F7BEA"></circle><path d="M8 12.5l2.7 2.7L16 9.8" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>
      <div style="margin-top: 6px; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #5F5B68">
        <span>@maestro_seed_host</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"></path><path d="M13.5 6.5l4 4"></path></svg>
      </div>
      <div style="margin-top: 20px; width: 100%; max-width: 300px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="font-size: 18px; font-weight: 500">10</span><span style="font-size: 13px; color: #5F5B68">Posts</span></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="font-size: 18px; font-weight: 500">1</span><span style="font-size: 13px; color: #5F5B68">Followers</span></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="font-size: 18px; font-weight: 500">0</span><span style="font-size: 13px; color: #5F5B68">Following</span></div>
      </div>
    </div>

    <section style="padding: 28px 16px 0; flex-shrink: 0">
      <h2 style="margin: 0 0 14px; font-size: 16px; font-weight: 500">Quick Actions</h2>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: 8px; row-gap: 14px">
        <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0; background: transparent; border: 0">
          <span style="width: 56px; height: 56px; border-radius: 18px; background: #ECE9F2; color: #1D1B22; display: flex; align-items: center; justify-content: center">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"></rect><path d="M3 9.5h18"></path><path d="M8 2.5v4"></path><path d="M16 2.5v4"></path><path d="M8 14h.01M12 14h.01M16 14h.01M8 17.5h.01M12 17.5h.01" stroke-width="2.4"></path></svg>
          </span>
          <span style="font-size: 12px; font-weight: 500; color: #1D1B22">Calendar</span>
        </button>
        <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0; background: transparent; border: 0">
          <span style="width: 56px; height: 56px; border-radius: 18px; background: #ECE9F2; color: #1D1B22; display: flex; align-items: center; justify-content: center">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="4" rx="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="M9 14l2 2 4-4"></path></svg>
          </span>
          <span style="font-size: 12px; font-weight: 500; color: #1D1B22">Bookings</span>
        </button>
        <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0; background: transparent; border: 0">
          <span style="width: 56px; height: 56px; border-radius: 18px; background: #ECE9F2; color: #1D1B22; display: flex; align-items: center; justify-content: center">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
          </span>
          <span style="font-size: 12px; font-weight: 500; color: #1D1B22">Hours</span>
        </button>
        <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0; background: transparent; border: 0">
          <span style="width: 56px; height: 56px; border-radius: 18px; background: #ECE9F2; color: #1D1B22; display: flex; align-items: center; justify-content: center">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20a1 1 0 0 1-1-1v-1a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v1a1 1 0 0 1-1 1Z"></path><path d="M20 16a8 8 0 1 0-16 0"></path><path d="M12 4v4"></path><path d="M10 4h4"></path></svg>
          </span>
          <span style="font-size: 12px; font-weight: 500; color: #1D1B22">Services</span>
        </button>
        <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0; background: transparent; border: 0">
          <span style="width: 56px; height: 56px; border-radius: 18px; background: #ECE9F2; color: #1D1B22; display: flex; align-items: center; justify-content: center">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9a3 3 0 1 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 1 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"></path><path d="M9 9h.01"></path><path d="M15 9l-6 6"></path><path d="M15 15h.01"></path></svg>
          </span>
          <span style="font-size: 12px; font-weight: 500; color: #1D1B22">Coupons</span>
        </button>
        <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0; background: transparent; border: 0">
          <span style="width: 56px; height: 56px; border-radius: 18px; background: #ECE9F2; color: #1D1B22; display: flex; align-items: center; justify-content: center">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"></path><circle cx="12" cy="7.5" r="2"></circle><path d="M15 13a3 3 0 1 0-6 0"></path></svg>
          </span>
          <span style="font-size: 12px; font-weight: 500; color: #1D1B22">Customers</span>
        </button>
        <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0; background: transparent; border: 0">
          <span style="width: 56px; height: 56px; border-radius: 18px; background: #ECE9F2; color: #1D1B22; display: flex; align-items: center; justify-content: center">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          </span>
          <span style="font-size: 12px; font-weight: 500; color: #1D1B22">Team</span>
        </button>
      </div>
    </section>

    <div style="margin: 24px 16px 0; border-top: 1px solid #E2DEE9; border-bottom: 1px solid #E2DEE9; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); flex-shrink: 0">
      <button type="button" aria-label="Videos" aria-pressed="true" style="height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px; background: transparent; border: 0; padding: 0; color: #1D1B22">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="M16 10.5l5-3v9l-5-3"></path></svg>
        <span style="width: 22px; height: 2px; border-radius: 1px; background: #1D1B22"></span>
      </button>
      <button type="button" aria-label="Reviews" aria-pressed="false" style="height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px; background: transparent; border: 0; padding: 0; color: #8E8A96">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.9z"></path></svg>
        <span style="width: 22px; height: 2px; border-radius: 1px; background: transparent"></span>
      </button>
      <button type="button" aria-label="Events" aria-pressed="false" style="height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 8px; background: transparent; border: 0; padding: 0; color: #8E8A96">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"></rect><path d="M3 9.5h18"></path><path d="M8 2.5v4"></path><path d="M16 2.5v4"></path></svg>
        <span style="width: 22px; height: 2px; border-radius: 1px; background: transparent"></span>
      </button>
    </div>

    
  </div>

  <nav aria-label="Main" style="flex-shrink: 0; height: 72px; box-sizing: border-box; padding: 6px 4px 12px; background: #111113; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center">
    <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 4px; background: transparent; border: 0; padding: 4px 0; color: #A19EA8">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5"></path><path d="M5 9v11h5v-6h4v6h5V9"></path></svg>
      <span style="font-size: 10.5px">Home</span>
    </button>
    <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 4px; background: transparent; border: 0; padding: 4px 0; color: #A19EA8">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <span style="font-size: 10.5px">Search</span>
    </button>
    <button type="button" aria-label="Create post" style="display: flex; align-items: center; justify-content: center; background: transparent; border: 0; padding: 0; color: #FFFFFF">
      <span style="width: 44px; height: 44px; border-radius: 50%; background: #2B2A31; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </span>
    </button>
    <button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 4px; background: transparent; border: 0; padding: 4px 0; color: #A19EA8">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
      <span style="font-size: 10.5px">Map</span>
    </button>
    <button type="button" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; background: transparent; border: 0; padding: 4px 0; color: #FFFFFF">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
      <span style="font-size: 10.5px; font-weight: 500">Profile</span>
    </button>
  </nav>
</div>


</body>
</html>
