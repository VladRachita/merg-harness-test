<!doctype html>

<body>


<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">

<div style="width: 390px; height: 580px; box-sizing: border-box; overflow: hidden; background: #F7F5FB; color: #1D1B22; font-family: Roboto, system-ui, -apple-system, 'Segoe UI', sans-serif">

    <div style="flex: 1 1 auto; text-align: center; font-size: 15px; font-weight: 500">@maestro_bistro</div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 17px; font-weight: 500">1</span><span style="font-size: 12px; color: #5F5B68">Posts</span></div>

        <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 76px; height: 10px; background: #FFFFFF"></span>
        <span aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 160px; width: 10px; background: #FFFFFF"></span>

        <button type="button" aria-label="Copy address: Strada Mureșenilor 5, Brașov" style="position: absolute; left: 10px; right: 10px; bottom: 10px; height: 40px; padding: 0 12px; border: 0; border-radius: 20px; background: #FFFFFF; box-shadow: 0 1px 6px rgba(0,0,0,0.14); display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; text-align: left">

          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3A3742" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
          <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">

            <span style="font-size: 12.5px; color: #5F5B68">Until 22:30</span>

          </span>
          <span style="min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 14px; font-weight: 600">Expensive</span>
            <span style="font-size: 12.5px; color: #5F5B68">Price level</span>
          </span>
