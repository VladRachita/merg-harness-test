<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Book a table · Your details · Wine tasting</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>


<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
a{color:inherit}
::placeholder{color:#6E6A78;opacity:1}
input:focus,textarea:focus{outline:none}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #F7F5FB; color: #1D1B22; font-family: Roboto, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <div style="height: 64px; padding: 0 6px; display: flex; align-items: center; gap: 4px; flex-shrink: 0">
    <a href="tb2e-guests-time-event.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 22px; color: #1D1B22"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 18l-6-6 6-6"></path></svg></a>
    <span style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 18px; font-weight: 500">Book a table</h1>
      <span style="font-size: 12.5px; color: #5F5B68">Maestro Bistro · free to book</span>
    </span>
  </div>

  <div style="flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 4px 16px 0; display: flex; flex-direction: column">
    <div style="background: #FFFFFF; border: 1px solid #E7E3ED; border-radius: 18px; overflow: hidden">
      <div style="padding: 12px 6px 12px 14px; display: flex; align-items: center; gap: 12px">
      <span style="width: 52px; height: 60px; flex-shrink: 0; border-radius: 14px; background: #1D1B22; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px"><span style="font-size: 11px; color: rgba(255,255,255,0.8)">Mon</span><span style="font-size: 17px; font-weight: 600; line-height: 1.15">26</span><span style="font-size: 11px; color: rgba(255,255,255,0.8)">Oct</span></span>
      <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 17px; font-weight: 700">19:00 – 20:30</span>
        <span style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #5F5B68; white-space: nowrap">
          <span style="display: flex; align-items: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>2 guests</span>
          <span style="display: flex; align-items: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>1 h 30 min</span>
        </span>
      </span>
      <a href="tb2e-guests-time-event.html" style="flex-shrink: 0; height: 44px; padding: 0 10px; display: flex; align-items: center; text-decoration: none; font-size: 14px; font-weight: 500; color: #1D1B22">Change</a>
      </div>
      <div style="padding: 12px 14px; background: #EEEAFD; color: #5B3FD6; display: flex; align-items: center; gap: 12px">
        <span style="width: 52px; flex-shrink: 0; display: flex; justify-content: center"><span style="width: 30px; height: 30px; border-radius: 50%; background: #7155E0; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7.5" r="3"></circle><path d="M6.5 20v-1.5a5.5 5.5 0 0 1 11 0V20"></path><circle cx="5" cy="10" r="2.2"></circle><path d="M1.5 19v-.6a3.6 3.6 0 0 1 4.6-3.4"></path><circle cx="19" cy="10" r="2.2"></circle><path d="M22.5 19v-.6a3.6 3.6 0 0 0-4.6-3.4"></path></svg></span></span>
        <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14.5px; font-weight: 700">Wine tasting</span><span style="font-size: 12.5px">Sitting 19:00 – 20:30 · 2 seats held for you</span></span>
      </div>
    </div>

    <h2 style="margin: 20px 4px 8px; font-size: 15px; font-weight: 600">Your details</h2>
    <div style="background: #FFFFFF; border: 1px solid #E7E3ED; border-radius: 18px; overflow: hidden">
      <div style="min-height: 56px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; gap: 12px;">
        <span style="flex-shrink: 0; display: flex; color: #5F5B68"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span>
        <label for="tb-first" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">First name</label>
        <input id="tb-first" type="text" autocomplete="given-name" placeholder="First name" style="flex: 1 1 0; min-width: 0; height: 44px; box-sizing: border-box; padding: 0; border: 0; background: transparent; font-size: 15px">
        <span aria-hidden="true" style="width: 1px; height: 28px; flex-shrink: 0; background: #E2DEE9"></span>
        <label for="tb-last" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Last name</label>
        <input id="tb-last" type="text" autocomplete="family-name" placeholder="Last name" style="flex: 1 1 0; min-width: 0; height: 44px; box-sizing: border-box; padding: 0; border: 0; background: transparent; font-size: 15px">
      </div>
      <div style="min-height: 56px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #EEEBF2;">
        <span style="flex-shrink: 0; display: flex; color: #5F5B68"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"></path></svg></span>
        <button type="button" aria-label="Country code, Romania +40. Change" style="flex-shrink: 0; height: 32px; padding: 0 6px 0 10px; border: 0; border-radius: 10px; background: #ECE9F2; display: flex; align-items: center; gap: 4px; font-size: 13.5px; font-weight: 500">RO +40<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
        <label for="tb-phone" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Phone number</label>
        <input id="tb-phone" type="tel" autocomplete="tel-national" placeholder="Phone number" style="flex: 1 1 auto; min-width: 0; height: 44px; box-sizing: border-box; padding: 0; border: 0; background: transparent; font-size: 15px">
      </div>
      <div style="min-height: 56px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; gap: 12px; border-top: 1px solid #EEEBF2;">
        <span style="flex-shrink: 0; display: flex; color: #5F5B68"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="2"></rect><path d="M22 7l-10 6L2 7"></path></svg></span>
        <label for="tb-mail" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Email</label>
        <input id="tb-mail" type="email" autocomplete="email" placeholder="Email" style="flex: 1 1 auto; min-width: 0; height: 44px; box-sizing: border-box; padding: 0; border: 0; background: transparent; font-size: 15px">
      </div>
      <div style="min-height: 56px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: flex-start; padding-top: 14px; padding-bottom: 10px; gap: 12px; border-top: 1px solid #EEEBF2;">
        <span style="flex-shrink: 0; display: flex; color: #5F5B68"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg></span>
        <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
          <label for="tb-req" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Special requests</label>
          <textarea id="tb-req" maxlength="1000" placeholder="Special requests (optional)" style="width: 100%; height: 58px; box-sizing: border-box; padding: 0; border: 0; background: transparent; font-size: 15px; line-height: 1.4; resize: none"></textarea>
          <span style="align-self: flex-end; font-size: 11px; color: #8E8A96">0 / 1000</span>
        </span>
      </div>
    </div>
    <p style="margin: 12px 4px 0; display: flex; gap: 6px; font-size: 12.5px; line-height: 1.4; color: #5F5B68"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 7.5h.01"></path></svg>Free to book. Seats are held for the whole sitting, so please arrive on time.</p>
  </div>

  <div style="flex-shrink: 0; padding: 12px 16px 28px; background: #FFFFFF; border-top: 1px solid #E7E3ED">
    <a href="tb4-booked.html" style="height: 52px; border-radius: 16px; background: #1D1B22; color: #FFFFFF; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 16px; font-weight: 500">Confirm reservation</a>
  </div>
</div>


</body>
</html>
