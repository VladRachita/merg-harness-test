<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick action icon set</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>

  <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 16px">
    <div style="display: flex; flex-direction: column; align-items: center; padding: 26px 12px 22px; background: #FFFFFF; border: 1px solid #E4E0EA; border-radius: 20px">
      <span style="width: 72px; height: 72px; border-radius: 22px; background: #ECE9F2; color: #1D1B22; display: flex; align-items: center; justify-content: center">

      <span style="width: 72px; height: 72px; border-radius: 22px; background: #ECE9F2; color: #1D1B22; display: flex; align-items: center; justify-content: center">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20a1 1 0 0 1-1-1v-1a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v1a1 1 0 0 1-1 1Z"></path><path d="M20 16a8 8 0 1 0-16 0"></path><path d="M12 4v4"></path><path d="M10 4h4"></path></svg>

      <span style="margin-top: 4px; font-size: 13px; color: #5F5B68">What you offer</span>

      <span style="width: 72px; height: 72px; border-radius: 22px; background: #ECE9F2; color: #1D1B22; display: flex; align-items: center; justify-content: center">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"></path><circle cx="12" cy="7.5" r="2"></circle><path d="M15 13a3 3 0 1 0-6 0"></path></svg>

      <span style="margin-top: 4px; font-size: 13px; color: #5F5B68">Client list</span>
    </div>

      <span style="width: 72px; height: 72px; border-radius: 22px; background: #ECE9F2; color: #1D1B22; display: flex; align-items: center; justify-content: center">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>

      <span style="margin-top: 4px; font-size: 13px; color: #5F5B68">Your staff</span>
    </div>
  </div>
  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 28px; font-size: 13px; color: #5F5B68">
    <span>24 px grid</span>
    <span>1.8 px stroke</span>
    <span>Round caps and joins</span>
    <span>One colour, no fills</span>
    <span>Label always shown under or beside the icon</span>
  </div>
</div>


</body>
</html>
